<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foodtown Chamber Directory Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script src="scripts/default.js" defer></script>
    <link rel="icon" href="images/food.png">
    <link rel="stylesheet" href="styles/chamber.css">
    <link rel="stylesheet" href="styles/chamber-large.css">
    <meta name="description"
      content="WDD 231 – Chamber Project Directoy Page made by Miguel J. Subero Saballo">
    <meta name="author" content="Miguel J. Subero Saballo">
    <meta property="og:title" content="Chamber Project Directoy Page made by Miguel J. Subero Saballo">
    <meta property="og:description" content="A webpage that showcases Commerces of the region of Foodtown in order to provide information and foster Commerce.">
    <meta property="og:image" content="Foodtown logo.">
    <meta property="og:url" content="https://versionxv.github.io/wdd231/chamber/directory.html">
</head>
<body>
    
    <header>
        <div class="name">
            <img src="images/food.png" alt="A simple food plate logo.">
            <p>Foodtown Chamber of Commerce</p>
        </div>

        <div>
            <input type="checkbox" id="theme" class="mode-checkbox" aria-label="Dark and Ligth Mode Button.">
            <label for="theme" class="mode-label">
                <span class="icon sun">☀️</span>
                <span class="icon moon">🌙</span>
                <span class="mode-ball"></span>
            </label>
        </div>

        <button type="button" id="menu" aria-label="Meunu Button"></button>

        <nav>
            <ul class="navigation">
                <li><a href="#">Home</a></li>
                <li><a href="#">Directory</a></li>
                <li><a href="#">Discover</a></li>
                <li><a href="#">Join</a></li>
            </ul>
        </nav>
        
    </header>

    <main>
        <h1>Directory</h1>

        <div class="layout">
            <ul >
                <li>
                    <button type="button" id="grid">GRID</button>
                </li>

                <li>
                    <button type="button" id="list">LIST</button>
                </li>
            </ul>
        </div>
        

        <div class="container"></div>
    </main>

    <footer>

        <div class="chamber">
            <p>Foodtown Chamber of Commerce</p>
            <p>99 Street</p>
            <p>City, Country</p>
            <p>info@placeholdercommercel.org</p>
            <p>(111) 1234-5678</p>
        </div>

        <div class="icons">
            <a href="https://www.instagram.com/">
                <img src="images/instagram.png" alt="The instagram logo.">
            </a>

            <a href="https://web.whatsapp.com/">
                <img src="images/whatsapp.png" alt="The Whatsapp logo.">
            </a>

            <a href="https://youtube.com/">
                <img src="images/youtube.png" alt="The YouTube logo.">
            </a>
        </div>

        <div class="year">
            <p>WDD231 Class Project</p>
            <p>Miguel J. Subero Saballo</p>
            <p>©<span id="currentyear"></span> Placeholder Chamber of Commerce</p>
            <p>Last Modified:<span id="lastmodified"></span>
        </div>
    </footer>
</body>
</html>
